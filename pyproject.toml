[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "repair-agents"
version = "0.1.0"
description = "RePair: Rubric-Guided Turn-Level Preference Learning for Tool-Using Agents"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "httpx>=0.27,<1",
  "tomli>=2; python_version < '3.11'",
]

[project.optional-dependencies]
retrieval = ["bm25s>=0.2.6,<0.3", "PyStemmer>=2.2,<3", "transformers>=4.51,<5"]
induction = ["numpy>=1.26,<3", "scikit-learn>=1.5,<2"]
train = ["torch>=2.6", "transformers>=4.51,<5", "peft>=0.14,<0.19", "safetensors>=0.5"]
test = ["pytest>=8,<10", "ruff>=0.11", "build>=1.2"]

[project.scripts]
repair = "repair.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["training: requires the training dependencies"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

